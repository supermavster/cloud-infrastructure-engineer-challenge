name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.15.9"
  TFLINT_VERSION: "v0.64.0"
  GITLEAKS_VERSION: "8.30.1"
  TERRAFORM_DOCS_VERSION: "0.24.0"

jobs:
  function:
    name: Lambda function
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: make function-lint
      - run: make function-test
      - run: make function-integration
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: appdb
          DB_USER: app
          DB_PASSWORD: ci-test-only
          DB_SSL_MODE: disable
      - run: make build

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: make fmt-check
      - run: make validate
      - run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - run: make lint
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: make actionlint

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: make scan
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${archive}" "${base}/${archive}"
          curl -fsSL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}$" checksums.txt | sha256sum -c -
          tar -xzf "${archive}" gitleaks
      - name: Scan the full history for secrets
        run: ./gitleaks git --redact --no-banner

  docs:
    name: Generated docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install terraform-docs
        run: |
          set -euo pipefail
          base="https://github.com/terraform-docs/terraform-docs/releases/download/v${TERRAFORM_DOCS_VERSION}"
          archive="terraform-docs-v${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          curl -fsSL -o "${archive}" "${base}/${archive}"
          curl -fsSL -o checksums.txt "${base}/terraform-docs-v${TERRAFORM_DOCS_VERSION}.sha256sum"
          grep " ${archive}$" checksums.txt | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/bin" terraform-docs
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - run: make docs
      - name: Fail if a generated README is out of date
        run: git --no-pager diff --exit-code
